<svg width="200" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <circle cx="100" cy="100" r="90" fill="none" stroke="#7c3aed" stroke-width="4" filter="url(#glow)">
    <animate attributeName="stroke-opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <clipPath id="circle-clip"><circle cx="100" cy="100" r="85"/></clipPath>
  <image href="https://github.com/chudasamaharshil04-prog.png" x="15" y="15" width="170" height="170" clip-path="url(#circle-clip)"/>
</svg>
